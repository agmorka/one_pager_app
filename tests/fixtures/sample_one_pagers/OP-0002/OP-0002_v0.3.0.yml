structureDefinition: "structure_one_pager_v_2.json"
dataProduct: "order"
productName: "Order Master Data"
businessDomain: "Sales"
dataProductType: "Foundational"
onePagerStatus: "In Review"
dataProductStatus: "In Definition"
version: "0.3.0"

dataProductOwner:
  name: "Bob Smith"
  initials: "BS"
  email: "bob.smith@company.com"
  team: "Sales Analytics"

smes:
  - name: "Diana Prince"
    initials: "DP"
    email: "diana.prince@company.com"
    team: "Finance"

description: |
  The Order Master Data product provides a comprehensive, unified view of all customer orders 
  across sales channels, fulfillment networks, and time periods. It integrates order header 
  (order details, timing, customer, payment) with line items and fulfillment tracking.

businessProblemStatement: |
  Order data is fragmented across e-commerce, point-of-sale, and ERP systems. Order reconciliation 
  takes weeks, reporting is inconsistent, and revenue attribution is unreliable. We need a 
  single authoritative order dataset with complete lineage from capture to fulfillment.

useCases:
  - useCaseId: "UC-002"
  - useCaseId: "UC-003"
  - useCaseId: "UC-004"

businessRequirements:
  - id: "BR-001"
    requirement: "Orders captured within 15 minutes of transaction"
    priority: "Must Have"
  - id: "BR-002"
    requirement: "Support 1000+ orders per second throughput"
    priority: "High"

dataSources:
  - name: "Shopify"
    sourceSystem: "Shopify"
    dataProvided: "Online sales orders"
    refreshFrequency: "Near real time"
  - name: "SAP ERP"
    sourceSystem: "SAP ERP"
    epoId: "EPO-1042"
    dataProvided: "B2B and contract orders"
    refreshFrequency: "Hourly"

dataProductPreview:
  - elementName: "order_id"
    dataType: "STRING"
    isPrimaryKey: true
    containsPII: false
    isCriticalDataElement: true
    cdeCriticalityTiering: "Tier 1"
    description: "Unique order identifier"
    example: "SO-2026-000042"
    useCaseLinks: ["UC-003", "UC-004"]
  - elementName: "order_date"
    dataType: "TIMESTAMP"
    containsPII: false
    isCriticalDataElement: false
    description: "When order was placed"
  - elementName: "customer_id"
    dataType: "STRING"
    containsPII: true
    isCriticalDataElement: true
    cdeCriticalityTiering: "Tier 2"
    description: "Reference to Person master"
    useCaseLinks: ["UC-002"]
  - elementName: "total_amount"
    dataType: "DECIMAL"
    containsPII: false
    isCriticalDataElement: true
    cdeCriticalityTiering: "Tier 1"
    description: "Total order value"
    useCaseLinks: ["UC-003"]

dataClassification:
  classificationLevel: "Confidential"
  containsPII: true
  containsSensitiveData: true

retentionRequirements:
  - dataCategory: "Order records"
    retentionPeriod: "7 years"
    legalBasis: "Audit and tax compliance"

dataGovernanceArtifacts:
  businessConcepts:
    - name: "Order"
      definition: "A customer's confirmed request to buy one or more products."

outOfScope:
  - "Quotes and abandoned carts"

openQuestions:
  - question: "Which system owns returns?"
    owner: "DP"
    dueDate: "2026-11-15"
    status: "Open"

assumptions:
  - "All channels send a unique order ID"
