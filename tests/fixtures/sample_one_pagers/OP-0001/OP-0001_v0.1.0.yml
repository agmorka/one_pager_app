structureDefinition: "structure_one_pager_v_1.json"
dataProduct: "person"
productName: "Person Master Data"
businessDomain: "Customer"
dataProductType: "Foundational"
onePagerStatus: "Draft"
dataProductStatus: "In Definition"
version: "0.1.0"

dataProductOwner:
  name: "Alice Brown"
  initials: "AB"
  email: "alice.brown@company.com"
  team: "Data Platform"

description: |
  The Person Master Data product provides a unified, authoritative view of all individuals 
  (employees, customers, prospects) across the organization.

businessProblemStatement: |
  Person data is scattered across 15+ different source systems with no single source of truth.

useCases:
  - persona: "Analytics Manager"
    goal: "Understand customer lifetime value trends"
    scenario: "Aggregate spending, engagement, and product usage without duplicate records"
    decisionEnabled: "Identify high-value customer segments"
    priority: "Must Have"

businessRequirements:
  - requirement: "Person records must be updated within 4 hours of source system changes"
    priority: "Must Have"

dataSources:
  - sourceName: "SAP ERP"
    sourceType: "Enterprise System"
    description: "Employee and vendor master data"

dataClassification:
  classificationLevel: "Internal"
  containsPII: true
  containsSensitiveData: false

dataElementPreview:
  - elementName: "person_id"
    dataType: "STRING"
    description: "Unique person identifier"
    isCriticalDataElement: true
