structureDefinition: "structure_one_pager_v_2.json"
dataProduct: "person"
productName: "Person Master Data"
businessDomain: "Customer"
dataProductType: "Foundational"
onePagerStatus: "Approved"
dataProductStatus: "Ready for Development"
version: "1.0.0"

dataProductOwner:
  name: "Alice Brown"
  initials: "ABR"
  email: "alice.brown@company.com"
  team: "Data Platform"

smes:
  - name: "Charlie Davis"
    initials: "CDA"
    email: "charlie.davis@company.com"
    team: "Analytics"

description: |
  The Person Master Data product provides a unified, authoritative view of all individuals 
  (employees, customers, prospects) across the organization. This foundational dataset 
  serves as the basis for customer analytics, reporting, and operational systems.

businessProblemStatement: |
  Person data is scattered across 15+ different source systems with no single source of truth. 
  This creates data quality issues, duplicates, and inconsistent customer identification across 
  analytics and operations. We need one authoritative person dataset that all downstream systems 
  can trust, with real-time updates from source systems and a clear data lineage.

useCases:
  - useCaseId: "UC-001"
  - useCaseId: "UC-002"

businessRequirements:
  - id: "BR-001"
    requirement: "Person records must be updated within 4 hours of source system changes"
    priority: "Must Have"
  - id: "BR-002"
    requirement: "Person data must be available 99.5% of the time"
    priority: "Must Have"
    notes: "Measured monthly, excluding planned maintenance windows"

dataSources:
  - name: "SAP ERP"
    sourceSystem: "SAP ERP"
    epoId: "EPO-1042"
    dataProvided: "Employee and vendor master data"
    refreshFrequency: "Hourly"
  - name: "Salesforce CRM"
    sourceSystem: "Salesforce"
    epoId: "EPO-2210"
    dataProvided: "Customer and prospect contact information"
    refreshFrequency: "Every 15 minutes"

dataProductPreview:
  - elementName: "person_id"
    dataType: "STRING"
    isPrimaryKey: true
    containsPII: false
    isCriticalDataElement: true
    cdeCriticalityTiering: "Tier 1"
    description: "Unique person identifier"
    example: "P-000123"
    source: "SAP ERP"
    useCaseLinks: ["UC-001", "UC-002"]
  - elementName: "person_name"
    dataType: "STRING"
    containsPII: true
    isCriticalDataElement: false
    description: "Full name"
    source: "SAP ERP"
  - elementName: "email_address"
    dataType: "STRING"
    containsPII: true
    isCriticalDataElement: false
    description: "Primary email address"
    source: "Salesforce CRM"
  - elementName: "customer_segment"
    dataType: "STRING"
    containsPII: false
    isCriticalDataElement: true
    cdeCriticalityTiering: "Tier 2"
    description: "Customer classification (Premium, Standard, Prospect)"
    example: "Premium"
    source: "Salesforce CRM"
    useCaseLinks: ["UC-001"]

dataClassification:
  classificationLevel: "Internal"
  containsPII: true
  containsSensitiveData: false

retentionRequirements:
  - dataCategory: "Active person records"
    retentionPeriod: "7 years after last interaction"
    legalBasis: "Danish Bookkeeping Act"

dataGovernanceArtifacts:
  businessConcepts:
    - name: "Person"
      definition: "An individual the organization has a relationship with: employee, customer or prospect."
  cdeQuality:
    - elementName: "person_id"
      dimension: "Uniqueness"
      rule: "No two active records share a person_id"
      threshold: "100%"
    - elementName: "customer_segment"
      dimension: "Validity"
      rule: "Value is one of Premium, Standard, Prospect"
      threshold: "99.9%"
  cdeLineage:
    - elementName: "person_id"
      sourceSystem: "SAP ERP"
      sourceField: "PERNR"
      transformation: "Prefixed with P- and zero-padded"

outOfScope:
  - "Corporate customers (covered by the Organization data product)"
  - "Historical addresses older than 7 years"

openQuestions:
  - question: "Should prospects without consent be included?"
    owner: "CDA"
    dueDate: "2026-10-31"
    status: "Answered"
    answer: "No, only prospects with marketing consent."

assumptions:
  - "SAP ERP remains the system of record for employees"
